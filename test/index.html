<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scout Test</title>
<meta name="apple-mobile-web-app-title" content="Scout Test">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2a1458">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#2a1458;color:#fff;font:16px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header img{width:56px;height:56px;border-radius:13px}
h1{margin:0;font-size:24px} small{color:#cdbfee}
button{display:block;width:100%;min-height:48px;margin:10px 0;border:0;border-radius:14px;background:#fff;color:#2a1458;font-weight:700;font-size:16px;font-family:inherit}
[hidden]{display:none}
button:disabled{opacity:.45} button.ghost{background:#4a2c8a;color:#fff}
#who,#left{margin:6px 0;color:#cdbfee;font-size:14px}
ol{list-style:none;margin:14px 0;padding:0}
li{display:flex;gap:10px;padding:12px;margin:8px 0;border-radius:12px;background:#3b2275;font-size:14px}
li b{flex:none;width:20px;text-align:center} li.ok b{color:#7be495} li.bad b{color:#ff8a8a}
pre{white-space:pre-wrap;word-break:break-word;margin:12px 0 0;padding:12px;border-radius:12px;background:#1d0e40;color:#cdbfee;font-size:12px}
</style></head><body>
<main>
<header><img src="apple-touch-icon.png" alt=""><div><h1>Scout test</h1><small id="mode"></small></div></header>
<button id="in" disabled>Sign in with Google</button>
<div id="who"></div><div id="left"></div>
<ol>
<li id="c1"><b>·</b><span>Open the Scout sheet</span></li>
<li id="c2"><b>·</b><span>Write a row to the Test tab and read it back</span></li>
<li id="c3"><b>·</b><span>List your Google calendars</span></li>
</ol>
<button id="re" class="ghost" hidden>Test reconnect (new token)</button>
<button id="cp" class="ghost">Copy results</button>
<pre id="log"></pre>
</main>
<script>
var CLIENT_ID = '205279511864-mflcs2kjrptbe6gcuc2qmrhf17d1bj84.apps.googleusercontent.com';
var SHEET = '1YcY3HbP-yWpypR83tpE8s5fIwUdtmrsYO49zFUtZ4qI';
var SCOPES = 'openid email https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.readonly';
// shortcut: browser-only sign-in gives one-hour tokens and no refresh token, fine for this test, revisit before porting the real app
var $ = function (id) { return document.getElementById(id); };
var tok = '', until = 0, tc = null, email = '', asked = 0, lines = [];
var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
var ios = /iPhone|iPad/.test(navigator.userAgent);
$('mode').textContent = (standalone ? 'Home-screen app' : 'Browser tab') + ' · ' + (ios ? 'iPhone' : 'not an iPhone');
function log(m) { lines.push(m); $('log').textContent = lines.join('\n'); }
function mark(n, ok, text) { var li = $('c' + n); li.className = ok ? 'ok' : 'bad'; li.firstChild.textContent = ok ? '✓' : '✗'; li.lastChild.textContent = text; log((ok ? 'OK   ' : 'FAIL ') + n + ': ' + text); }
log('Mode: ' + (standalone ? 'home-screen app' : 'browser tab') + ', ' + (ios ? 'iPhone' : 'other device'));

function boot() {
  if (CLIENT_ID.indexOf('PASTE') === 0) { log('No Google client ID in this page yet.'); return; }
  tc = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: got,
    error_callback: function (e) { asked = 0; log('Sign-in window problem: ' + ((e && (e.type || e.message)) || 'unknown')); }
  });
  $('in').disabled = false;
}
function got(r) {
  if (r.error) { asked = 0; log('Sign-in failed: ' + r.error + (r.error_description ? ' (' + r.error_description + ')' : '')); return; }
  tok = r.access_token; until = Date.now() + r.expires_in * 1000;
  if (asked) { log('Reconnect took ' + ((Date.now() - asked) / 1000).toFixed(1) + ' s'); asked = 0; return; }
  log('Signed in. The token lasts ' + Math.round(r.expires_in / 60) + ' minutes.');
  run();
}
async function api(url, opt) {
  var t0 = performance.now();
  var r = await fetch(url, Object.assign({}, opt, { headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' } }));
  var ms = Math.round(performance.now() - t0), txt = await r.text();
  if (!r.ok) throw new Error(r.status + ' ' + txt.replace(/\s+/g, ' ').slice(0, 160));
  return { j: txt ? JSON.parse(txt) : {}, ms: ms };
}
async function run() {
  $('re').hidden = false;
  var S = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET, tabs = [];
  try { var u = await api('https://www.googleapis.com/oauth2/v3/userinfo'); email = u.j.email || ''; $('who').textContent = 'Signed in as ' + email; } catch (e) { log('Could not read the account: ' + e.message); }
  try {
    var m = await api(S + '?fields=properties.title,sheets.properties.title');
    tabs = m.j.sheets.map(function (s) { return s.properties.title; });
    mark(1, true, 'Opened "' + m.j.properties.title + '" in ' + m.ms + ' ms. Tabs: ' + tabs.join(', '));
  } catch (e) { mark(1, false, e.message); return; }
  try {
    if (tabs.indexOf('Test') < 0) await api(S + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [{ addSheet: { properties: { title: 'Test' } } }] }) });
    var w = await api(S + '/values/Test!A:D:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: JSON.stringify({ values: [[new Date().toISOString(), email, standalone ? 'home-screen app' : 'browser', navigator.userAgent.slice(0, 80)]] }) });
    var rd = await api(S + '/values/Test!A:D');
    mark(2, true, 'Wrote a row and read it back: ' + rd.j.values.length + ' row(s) on the Test tab (write ' + w.ms + ' ms, read ' + rd.ms + ' ms)');
  } catch (e) { mark(2, false, e.message); }
  try {
    var c = await api('https://www.googleapis.com/calendar/v3/users/me/calendarList?fields=items(summary)');
    var names = c.j.items.map(function (x) { return x.summary; });
    mark(3, true, names.length + ' calendars in ' + c.ms + ' ms: ' + names.slice(0, 3).join(', ') + (names.length > 3 ? ', …' : ''));
  } catch (e) { mark(3, false, e.message); }
}
$('in').onclick = function () { tc.requestAccessToken(); };
$('re').onclick = function () { asked = Date.now(); log('Reconnect: asking for a new token…'); tc.requestAccessToken(); };
$('cp').onclick = function () {
  var t = lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { $('cp').textContent = 'Copied'; }, function () { var r = document.createRange(); r.selectNodeContents($('log')); getSelection().removeAllRanges(); getSelection().addRange(r); $('cp').textContent = 'Selected, tap Copy'; });
};
setInterval(function () {
  if (!tok) return; var s = Math.round((until - Date.now()) / 1000);
  $('left').textContent = s > 0 ? 'Token valid for ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) : 'Token expired, tap Test reconnect';
}, 1000);
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="boot()" onerror="log('Could not load Google sign-in (blocked or offline).')"></script>
</body></html>
